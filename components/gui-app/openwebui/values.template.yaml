nameOverride: openwebui
ingress:
  enabled: true
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
  {{#if DOMAIN}}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  host: openwebui.{{{DOMAIN}}}
  {{else}}
  host:
  {{/if}}

# openaiBaseApiUrl: https://litellm.{{{DOMAIN}}}/v1
openaiBaseApiUrl: http://litellm.litellm:4000/v1
# The chart injects OPENAI_API_KEY from openaiApiKey automatically. Do NOT also
# set OPENAI_API_KEY under extraEnvVars or the StatefulSet gets a duplicate env
# key and helm fails with "duplicate entries for key [name=OPENAI_API_KEY]".
openaiApiKey: {{{LITELLM_API_KEY}}}

extraEnvVars:
  - name: WEBUI_ADMIN_EMAIL
    value: {{{OPENWEBUI_ADMIN_EMAIL}}}
  - name: WEBUI_ADMIN_PASSWORD
    value: {{{OPENWEBUI_ADMIN_PASSWORD}}}

ollama:
  enabled: false
pipelines:
  enabled: false

persistence:
  enabled: true
  size: 100Gi

resources:
  requests:
    cpu: 1 
    memory: 2Gi
  limits:
    memory: 2Gi

# The websocket Redis (openwebui-redis) uses ~5 MiB but had no request; declare
# it so the scheduler accounts for the pod.
websocket:
  redis:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi
