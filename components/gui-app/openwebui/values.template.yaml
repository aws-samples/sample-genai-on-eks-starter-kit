nameOverride: openwebui
ingress:
  # Private by default — see the LiteLLM values template for the rationale.
  # Without DOMAIN the Service stays ClusterIP; reach the UI with:
  #
  #   kubectl port-forward -n openwebui svc/open-webui 8080:80
  #   # then http://localhost:8080
  enabled: {{#if DOMAIN}}true{{else}}false{{/if}}
  {{#if DOMAIN}}
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  host: openwebui.{{{DOMAIN}}}
  {{/if}}

# openaiBaseApiUrl: https://litellm.{{{DOMAIN}}}/v1
openaiBaseApiUrl: http://litellm.litellm:4000/v1
openaiApiKey: {{{LITELLM_API_KEY}}}

extraEnvVars:
  - name: WEBUI_ADMIN_EMAIL
    value: {{{OPENWEBUI_ADMIN_EMAIL}}}
  - name: WEBUI_ADMIN_PASSWORD
    value: {{{OPENWEBUI_ADMIN_PASSWORD}}}

ollama:
  enabled: false
pipelines:
  enabled: false

persistence:
  enabled: true
  size: 100Gi

resources:
  requests:
    cpu: 1 
    memory: 2Gi
  limits:
    memory: 2Gi
