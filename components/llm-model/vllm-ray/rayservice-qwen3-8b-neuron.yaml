apiVersion: ray.io/v1
kind: RayService
metadata:
  name: qwen3-ray
  namespace: vllm
spec:
  serveConfigV2: |
    applications:
      - name: qwen3-neuron
        import_path: vllm_serve:app
        route_prefix: "/"
  rayClusterConfig:
    rayVersion: '2.58.0'
    enableInTreeAutoscaling: true
    headGroupSpec:
      rayStartParams: {}
      template:
        metadata:
          annotations:
            karpenter.sh/do-not-disrupt: "true"
        spec:
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
          - name: ray-head
            image: public.ecr.aws/agentic-ai-platforms-on-k8s/ray-vllm-neuron:sha-b66faee
            imagePullPolicy: IfNotPresent
            command: ["/bin/bash","-lc"]
            args:
            - |
              /opt/rayvenv/bin/ray start --head --dashboard-host=0.0.0.0 --dashboard-port=8265 --num-cpus=0 --num-gpus=0 --metrics-export-port=8080 --block --dashboard-agent-listen-port=52365 --no-monitor
            env:
            - { name: PYTHONPATH, value: "/home/ray" }
            - { name: RAY_SERVE_HTTP_HOST, value: "0.0.0.0" }
            resources:
              requests: { cpu: 3, memory: 8Gi }
              limits: { cpu: 4, memory: 12Gi }
            ports:
            - { containerPort: 6379, name: gcs }
            - { containerPort: 8265, name: dashboard }
            - { containerPort: 10001, name: client }
            - { containerPort: 8000, name: serve }
            - { containerPort: 52365, name: dashboard-agent }
            - { containerPort: 8080, name: metrics }
            - { containerPort: 44217, name: as-metrics }
            - { containerPort: 44227, name: dash-metrics }
            livenessProbe:
              exec:
                command: ["bash","-c","python3 -c \"import urllib.request,sys; sys.exit(0 if b'success' in urllib.request.urlopen('http://localhost:52365/api/local_raylet_healthz',timeout=8).read() else 1)\""]
              initialDelaySeconds: 60
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 10
            readinessProbe:
              exec:
                command: ["bash","-c","/opt/rayvenv/bin/ray health-check --address 127.0.0.1:6379 > /dev/null 2>&1"]
              initialDelaySeconds: 30
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 10
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 1
      maxReplicas: 2
      groupName: neuron-group
      # Declare neuron_cores here (not only in the ray-start args) so the in-tree autoscaler knows this
      # worker group PROVIDES neuron_cores and will add a worker pod to satisfy a pending replica's demand.
      # NOTE the exact quoting: the KubeRay autoscaler strips the outer character pair before json.loads
      # (autoscaling_config.py: resources_string[1:-1]), so the value MUST carry an extra outer quote pair.
      # '"{\"neuron_cores\": 2}"' is the canonical form (see ray-cluster.complete.yaml). A bare
      # '{"neuron_cores": 2}' makes the autoscaler crash-loop with `JSONDecodeError: Extra data`.
      rayStartParams:
        resources: '"{\"neuron_cores\": 2}"'
      template:
        metadata:
          annotations:
            karpenter.sh/do-not-disrupt: "true"
        spec:
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/arch: amd64
            node.kubernetes.io/instance-type: inf2.xlarge
          tolerations:
          - { key: "aws.amazon.com/neuron", operator: "Exists", effect: "NoSchedule" }
          containers:
          - name: ray-worker
            image: public.ecr.aws/agentic-ai-platforms-on-k8s/ray-vllm-neuron:sha-b66faee
            imagePullPolicy: IfNotPresent
            command: ["/bin/bash","-lc"]
            args:
            - |
              /opt/rayvenv/bin/ray start --address=${RAY_ADDRESS:-${FQ_RAY_IP}:6379} --resources='{"neuron_cores": 2}' --dashboard-agent-listen-port=52365 --metrics-export-port=8080 --block --num-cpus=2 --num-gpus=0 --no-monitor
            env:
            - { name: PYTHONPATH, value: "/home/ray" }
            - { name: NEURON_RT_NUM_CORES, value: "2" }
            - { name: NEURON_RT_VISIBLE_CORES, value: "0,1" }
            - { name: HF_HOME, value: "/root/.cache/huggingface" }
            - { name: HF_HUB_CACHE, value: "/root/.cache/huggingface/hub" }
            resources:
              requests: { cpu: 3, memory: 12Gi, aws.amazon.com/neuroncore: 2 }
              # inf2.xlarge has 16 GiB total (allocatable is lower after system reservation),
              # and the shm emptyDir below (medium: Memory) also counts toward pod memory, so a
              # 20Gi limit could not fit / was OOM-fragile. Right-sized to 12Gi to match the request
              # and fit the node. NOTE: validate under sustained load before merging to main.
              limits: { memory: 12Gi, aws.amazon.com/neuroncore: 2 }
            livenessProbe:
              exec:
                command: ["bash","-c","python3 -c \"import urllib.request,sys; sys.exit(0 if b'success' in urllib.request.urlopen('http://localhost:52365/api/local_raylet_healthz',timeout=8).read() else 1)\""]
              initialDelaySeconds: 90
              periodSeconds: 20
              timeoutSeconds: 10
              failureThreshold: 15
            readinessProbe:
              exec:
                command: ["bash","-c","python3 -c \"import urllib.request,sys; sys.exit(0 if b'success' in urllib.request.urlopen('http://localhost:52365/api/local_raylet_healthz',timeout=8).read() else 1)\""]
              initialDelaySeconds: 45
              periodSeconds: 20
              timeoutSeconds: 10
              failureThreshold: 15
            volumeMounts:
            - { name: shm, mountPath: /dev/shm }
          volumes:
          - name: shm
            emptyDir: { medium: Memory, sizeLimit: 8Gi }
