apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-r1-qwen3-8b-neuron
  namespace: vllm
spec:
  replicas: 16
  selector:
    matchLabels:
      app: deepseek-r1-qwen3-8b-neuron
  template:
    metadata:
      labels:
        app: deepseek-r1-qwen3-8b-neuron
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      nodeSelector:
        node.kubernetes.io/instance-type: inf2.xlarge
      containers:
        - name: vllm
          image: public.ecr.aws/agentic-ai-platforms-on-k8s/vllm-neuron:deepseek-r1-qwen3-8b-optimum-neuron
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
            seccompProfile:
              type: RuntimeDefault
          command: ["vllm", "serve"]
          args:
            - /root/.cache/neuron/deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
            - --served-model-name=deepseek-r1-qwen3-8b-neuron
            - --trust-remote-code
            - --gpu-memory-utilization=0.90
            # - --max-model-len=32768 # 32K
            # DeepSeek-R1 specific
            - --reasoning-parser=deepseek_r1
            # No --enable-prefix-caching: the optimum-neuron backend (vLLM 0.10 V0
            # engine, static NxD batching, one 8192-token block per sequence) does
            # not implement prefix caching; the flag is ignored or breaks startup.
            # Cache-hit SLI panels therefore only cover the GPU pools.
            # Neuron specific
            - --tensor-parallel-size=2
            # - --gpu-memory-utilization=0.95
            - --max-num-seqs=2
            - --max-model-len=8192
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: HF_HUB_CACHE
              value: /root/.cache/huggingface/hub
            - name: NEURON_RT_NUM_CORES
              value: "2"
            - name: NEURON_RT_VISIBLE_CORES
              value: "0-1"
          ports:
            - name: http
              containerPort: 8000
          # See model-qwen3-8b-neuron.template.yaml: the EPP routes on the
          # Ready condition, so a pod that is still loading the model gets
          # traffic (503 Connection refused) unless readiness is gated on
          # /health. Applying this to a running pool restarts every pod.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 3 #75%
              memory: 12Gi #75%
              aws.amazon.com/neuroncore: 2
            limits:
              aws.amazon.com/neuroncore: 2
      tolerations:
        - key: aws.amazon.com/neuron
          operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: deepseek-r1-qwen3-8b-neuron
  namespace: vllm
spec:
  # Selects the neuron-lb Envoy pods (see neuron-lb.yaml): per-request
  # LEAST_REQUEST balancing across the replicas of this pool, which a
  # ClusterIP Service cannot do for keep-alive clients. The pods themselves
  # are reachable through the headless Service deepseek-r1-qwen3-8b-neuron-pods.
  selector:
    app.kubernetes.io/name: neuron-lb
  ports:
    - name: http
      port: 8000
      targetPort: 8002
