image:
  tag: main-v1.81.3-stable

global:
  security:
    # -- Allow insecure images to use our ECR images.
    allowInsecureImages: true

{{#if @root.integration.o11y.mlflow}}
image:
  repository: public.ecr.aws/agentic-ai-platforms-on-k8s/litellm
  tag: v1.79.1-mlflow
{{/if}}

resources:
  requests:
    cpu: 1 
    memory: 2Gi
  limits:
    memory: 2Gi

redis:
  enabled: true
  image:
    registry: public.ecr.aws
    repository: agentic-ai-platforms-on-k8s/redis
    tag: 8.2.1-debian-12-r0
    pullPolicy: IfNotPresent
  master:
    resources: 
      requests:
        cpu: 125m
        memory: 256Mi
      limits:
        memory: 256Mi

postgresql:
  image:
    registry: public.ecr.aws
    repository: agentic-ai-platforms-on-k8s/postgresql
    tag: 17.5.0-debian-12-r8
    pullPolicy: IfNotPresent
  primary:
    resources: 
      requests:
        cpu: 125m
        memory: 256Mi
      limits:
        memory: 256Mi

serviceAccount:
  create: true

masterkey: {{{LITELLM_API_KEY}}}
envVars:
  # SERVER_ROOT_PATH: /litellm # Same as Ingress path
  # UI_BASE_PATH: /litellm/ui # Move UI path but still need to build Docker image https://docs.litellm.ai/docs/proxy/deploy#1-custom-server-root-path-proxy-base-url
  # DOCS_URL: /docs/ # Move docs path but not working yet since LiteLLM hardcodes Swagger resource paths https://github.com/BerriAI/litellm/blob/main/litellm/proxy/proxy_server.py#L794-L796
  # LITELLM_LOG: DEBUG
  UI_USERNAME: {{{LITELLM_UI_USERNAME}}}
  UI_PASSWORD: {{{LITELLM_UI_PASSWORD}}}
  {{#if @root.integration.o11y.langfuse}}
  LANGFUSE_HOST: http://langfuse-web.langfuse:3000
  LANGFUSE_PUBLIC_KEY: {{{LANGFUSE_PUBLIC_KEY}}}
  LANGFUSE_SECRET_KEY: {{{LANGFUSE_SECRET_KEY}}}
  {{/if}}
  {{#if @root.integration.o11y.mlflow}}
  MLFLOW_TRACKING_URI: http://mlflow.mlflow
  MLFLOW_TRACKING_USERNAME: {{{MLFLOW_USERNAME}}}
  MLFLOW_TRACKING_PASSWORD: {{{MLFLOW_PASSWORD}}}
  MLFLOW_EXPERIMENT_NAME: Default
  MLFLOW_EXPERIMENT_ID: 0
  {{/if}}
  {{#if @root.integration.o11y.phoenix}}
  PHOENIX_API_KEY: {{{PHOENIX_API_KEY}}}
  PHOENIX_COLLECTOR_ENDPOINT: http://phoenix-svc.phoenix:4317/v1/traces
  PHOENIX_COLLECTOR_HTTP_ENDPOINT: http://phoenix-svc.phoenix:6006/v1/traces
  {{/if}}

ingress:
  # Private by default. Without DOMAIN there is no Ingress at all: the Service
  # stays ClusterIP and LiteLLM is reachable only from inside the cluster.
  #
  # This proxy holds an AWS credential (EKS Pod Identity, bedrock:InvokeModel)
  # and an admin API that can register new models, so an internet-facing ALB
  # makes it a public, credential-bearing endpoint. Reach it instead with a
  # port-forward from the machine that needs it:
  #
  #   kubectl port-forward -n litellm svc/litellm 4000:4000
  #   # then http://localhost:4000 (UI at /ui)
  #
  # Set DOMAIN only when you are deploying behind HTTPS on a hostname you own
  # and have put authentication in front of it.
  enabled: {{#if DOMAIN}}true{{else}}false{{/if}}
  {{#if DOMAIN}}
  className: shared-internet-facing-alb
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  hosts:
    - paths:
        - path: /
          pathType: Prefix
      host: litellm.{{{DOMAIN}}}
  {{/if}}

proxy_config:
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    # Models come only from the rendered model_list below, which is built from
    # config.json at deploy time. With store_model_in_db: true anyone holding
    # the master key can register ADDITIONAL models through the admin API at
    # runtime -- including models the deployment was never meant to serve.
    # Keep this false; change the config and redeploy to add a model.
    # IAM is the backstop (see main.tf): the pod role is scoped to the
    # configured model ARNs, so an unlisted model cannot be invoked either way.
    store_model_in_db: false
    store_prompts_in_spend_logs: true
  litellm_settings:
    drop_params: true
    {{#with integration.o11y.config}}
    {{#if callbacks}}
    callbacks: {{{callbacks}}}
    {{/if}}
    {{#if success_callback}}
    success_callback: {{{success_callback}}}
    {{/if}}
    {{#if failure_callback}}
    failure_callback: {{{failure_callback}}}
    {{/if}}
    {{/with}}
    redact_user_api_key_info: true
    turn_off_message_logging: false
  model_list:
    # Bedrock LLM Models
    {{#each integration.bedrock.llm}}
    - model_name: bedrock/{{{name}}}
      litellm_params:
        model: bedrock/{{{model}}}
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
    {{/each}}
    # Bedrock Embedding Models
    {{#each integration.bedrock.embedding}}
    - model_name: bedrock/{{{name}}}
      litellm_params:
        model: bedrock/{{{model}}}
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
    {{/each}}
    {{#each integration.llm-model.vllm}}
    - model_name: vllm/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.vllm:8000/v1
    {{/each}}
    # SGlang Models
    {{#each integration.llm-model.sglang}}
    - model_name: sglang/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.sglang:30000/v1
    {{/each}}
    # TGI Models
    {{#each integration.llm-model.tgi}}
    - model_name: tgi/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.tgi:80/v1
    {{/each}}
    # Ollama Models
    {{#each integration.llm-model.ollama}}
    - model_name: ollama/{{@key}}
      litellm_params:
        model: ollama/{{@key}}
        api_key: fake-key
        api_base: http://ollama.ollama:11434
        drop_params: true
    {{/each}}
    # TEI Models
    {{#each integration.embedding-model.tei}}
    - model_name: tei/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.tei:80/v1
    {{/each}}
  # MCP Servers
  {{#if integration.mcp-servers.length}}
  mcp_servers:
    {{#each integration.mcp-servers}}
    {{this}}:
      url: "http://{{this}}.mcp-server:8000/mcp"
      transport: "http"
      auth_type: "api_key"
      spec_version: "2025-03-26"
    {{/each}}
  {{/if}}
  # Guardrails
  guardrails:
    {{#with integration.guardrail}}
    {{#if bedrock}}
    - guardrail_name: "bedrock-guardrail"
      litellm_params:
        guardrail: bedrock
        mode: "post_call"
        default_on: true
        guardrailIdentifier: "{{{bedrock.id}}}"
        guardrailVersion: "{{{bedrock.version}}}"
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
    {{/if}}    
    {{#if guardrailsAI}}
    - guardrail_name: "guardrails-ai"
      litellm_params:
        guardrail: guardrails_ai
        mode: "pre_call"
        default_on: true
        guard_name: "detect-pii"
        guardrails_ai_api_input_format: "llmOutput"
        api_base: http://guard.guardrails-ai:8000
    {{/if}}
    {{/with}}
