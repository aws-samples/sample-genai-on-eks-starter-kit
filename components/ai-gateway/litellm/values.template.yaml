image:
  # v1.98.0 (Aug 2026 release line; "-stable" suffixed tags stopped at 1.83).
  # Needed for litellm_input_cached_tokens_metric (provider-side cached prompt
  # tokens per team / key / custom metadata label) — absent before ~v1.9x.
  tag: v1.98.0

global:
  security:
    # -- Allow insecure images to use our ECR images.
    allowInsecureImages: true

{{#if @root.integration.o11y.mlflow}}
image:
  repository: public.ecr.aws/agentic-ai-platforms-on-k8s/litellm
  tag: v1.79.1-mlflow
{{/if}}

resources:
  requests:
    cpu: 4
    memory: 2Gi
  limits:
    memory: 2Gi

# Keep the proxy replicas on different nodes. On 2026-09-02 one replica sat on a
# starved 4 GiB spot node and flapped Ready; every time it rejoined the Service
# half of the traffic through LiteLLM hung and the whole platform's token
# throughput collapsed. Preferred (not required) so a single-node cluster still
# schedules.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
              app.kubernetes.io/instance: litellm

redis:
  enabled: true
  image:
    registry: public.ecr.aws
    repository: agentic-ai-platforms-on-k8s/redis
    tag: 8.2.1-debian-12-r0
    pullPolicy: IfNotPresent
  master:
    # 4x the chart default: 256Mi left Postgres/Redis unable to answer
    # pg_isready/redis-cli probes within 5s under node pressure, which put
    # the pods into a liveness restart loop and took the gateway down.
    resources:
      requests:
        cpu: 125m
        memory: 1Gi
      limits:
        memory: 1Gi

postgresql:
  image:
    registry: public.ecr.aws
    repository: agentic-ai-platforms-on-k8s/postgresql
    tag: 17.5.0-debian-12-r8
    pullPolicy: IfNotPresent
  primary:
    # 4x the chart default: 256Mi left Postgres/Redis unable to answer
    # pg_isready/redis-cli probes within 5s under node pressure, which put
    # the pods into a liveness restart loop and took the gateway down.
    resources:
      requests:
        cpu: 125m
        memory: 1Gi
      limits:
        memory: 1Gi
    # 50Gi: the chart default 8Gi filled up on 2026-09-03 (7.76GiB used) and
    # Postgres crash-looped in WAL recovery ("No space left on device"), which
    # took LiteLLM to 0/2. store_prompts_in_spend_logs writes every prompt
    # (the RAG/review/agent templates are 500-1,000 tokens) per request, so
    # the spend-log table grows with the traffic generator's rate. The PVC
    # was expanded in place (StorageClass ebs allows expansion); this keeps
    # the template in sync for a fresh install.
    persistence:
      size: 50Gi

serviceAccount:
  create: true

# Prometheus scraping is done by ./servicemonitor.yaml (applied by index.mjs),
# not the chart's ServiceMonitor: /metrics/ needs a bearer token since v1.9x and
# the chart cannot attach one. Exposes litellm_* request/token/cached-token
# counters with team / api_key_alias / end_user labels — the tenant axis of the
# cache-hit SLI.
serviceMonitor:
  enabled: false

masterkey: {{{LITELLM_API_KEY}}}
envVars:
  # SERVER_ROOT_PATH: /litellm # Same as Ingress path
  # UI_BASE_PATH: /litellm/ui # Move UI path but still need to build Docker image https://docs.litellm.ai/docs/proxy/deploy#1-custom-server-root-path-proxy-base-url
  # DOCS_URL: /docs/ # Move docs path but not working yet since LiteLLM hardcodes Swagger resource paths https://github.com/BerriAI/litellm/blob/main/litellm/proxy/proxy_server.py#L794-L796
  # LITELLM_LOG: DEBUG
  UI_USERNAME: {{{LITELLM_UI_USERNAME}}}
  UI_PASSWORD: {{{LITELLM_UI_PASSWORD}}}
  {{#if @root.integration.o11y.langfuse}}
  LANGFUSE_HOST: http://langfuse-web.langfuse:3000
  LANGFUSE_PUBLIC_KEY: {{{LANGFUSE_PUBLIC_KEY}}}
  LANGFUSE_SECRET_KEY: {{{LANGFUSE_SECRET_KEY}}}
  {{/if}}
  {{#if @root.integration.o11y.mlflow}}
  MLFLOW_TRACKING_URI: http://mlflow.mlflow
  MLFLOW_TRACKING_USERNAME: {{{MLFLOW_USERNAME}}}
  MLFLOW_TRACKING_PASSWORD: {{{MLFLOW_PASSWORD}}}
  MLFLOW_EXPERIMENT_NAME: Default
  MLFLOW_EXPERIMENT_ID: 0
  {{/if}}
  {{#if @root.integration.o11y.phoenix}}
  PHOENIX_API_KEY: {{{PHOENIX_API_KEY}}}
  PHOENIX_COLLECTOR_ENDPOINT: http://phoenix-svc.phoenix:4317/v1/traces
  PHOENIX_COLLECTOR_HTTP_ENDPOINT: http://phoenix-svc.phoenix:6006/v1/traces
  {{/if}}
  {{#if @root.integration.o11y.tempo}}
  # Export gateway spans to Tempo via OTLP/HTTP so the LiteLLM hop joins the
  # same trace_id as the Beyla eBPF spans and the Langfuse observation.
  OTEL_EXPORTER: otlp_http
  OTEL_ENDPOINT: http://tempo-distributor.tempo.svc.cluster.local:4318/v1/traces
  {{/if}}

ingress:
  enabled: true
  className: {{#if DOMAIN}}shared-{{/if}}internet-facing-alb
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    {{#if DOMAIN}}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    {{/if}}
  hosts:
    - paths:
        - path: /
          pathType: Prefix
      {{#if DOMAIN}}
      host: litellm.{{{DOMAIN}}}
      {{/if}}

proxy_config:
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    store_model_in_db: true
    store_prompts_in_spend_logs: true
    # Open-Sora is not OpenAI-compatible (custom /generate + /status/{id} +
    # /videos/{id}.mp4 API), so it rides through as a pass-through endpoint
    # instead of a model_list entry.
    pass_through_endpoints:
      - path: /sora
        target: http://opensora-v2.vllm:8000
        include_subpath: true
        forward_headers: true
        timeout: 300
  litellm_settings:
    drop_params: true
    {{#with integration.o11y.config}}
    {{#if callbacks}}
    callbacks: {{{callbacks}}}
    {{/if}}
    {{#if success_callback}}
    success_callback: {{{success_callback}}}
    {{/if}}
    {{#if failure_callback}}
    failure_callback: {{{failure_callback}}}
    {{/if}}
    {{/with}}
    redact_user_api_key_info: true
    turn_off_message_logging: false
    # Prometheus (free in OSS; only managed-batch metrics are enterprise).
    # Custom metadata labels turn request metadata.* into metric labels so the
    # prefix-cache hit ratio can be split per tenant and per prompt template
    # version (KCD Token Factory: "hit rate as an SLI, by node/tenant/template").
    custom_prometheus_metadata_labels:
      - metadata.tenant
      - metadata.prompt_template
      - metadata.prompt_template_version
    enable_end_user_cost_tracking_prometheus_only: true
  model_list:
    # Bedrock LLM Models
    {{#each integration.bedrock.llm}}
    - model_name: bedrock/{{{name}}}
      litellm_params:
        model: bedrock/{{{model}}}
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
    {{/each}}
    # Bedrock Embedding Models
    {{#each integration.bedrock.embedding}}
    - model_name: bedrock/{{{name}}}
      litellm_params:
        model: bedrock/{{{model}}}
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
    {{/each}}
    {{#each integration.llm-model.vllm}}
    - model_name: vllm/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.vllm:8000/v1
    {{/each}}
    # SGlang Models
    {{#each integration.llm-model.sglang}}
    - model_name: sglang/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.sglang:30000/v1
    {{/each}}
    # TGI Models
    {{#each integration.llm-model.tgi}}
    - model_name: tgi/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.tgi:80/v1
    {{/each}}
    # Ollama Models
    {{#each integration.llm-model.ollama}}
    - model_name: ollama/{{@key}}
      litellm_params:
        model: ollama/{{@key}}
        api_key: fake-key
        api_base: http://ollama.ollama:11434
        drop_params: true
    {{/each}}
    # TEI Models
    {{#each integration.embedding-model.tei}}
    - model_name: tei/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.tei:80/v1
    {{/each}}
  # MCP Servers
  {{#if integration.mcp-servers.length}}
  mcp_servers:
    {{#each integration.mcp-servers}}
    {{this}}:
      url: "http://{{this}}.mcp-server:8000/mcp"
      transport: "http"
      auth_type: "api_key"
      spec_version: "2025-03-26"
    {{/each}}
  {{/if}}
  # Guardrails
  guardrails:
    {{#with integration.guardrail}}
    {{#if bedrock}}
    - guardrail_name: "bedrock-guardrail"
      litellm_params:
        guardrail: bedrock
        mode: "post_call"
        default_on: true
        guardrailIdentifier: "{{{bedrock.id}}}"
        guardrailVersion: "{{{bedrock.version}}}"
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
    {{/if}}    
    {{#if guardrailsAI}}
    - guardrail_name: "guardrails-ai"
      litellm_params:
        guardrail: guardrails_ai
        mode: "pre_call"
        default_on: true
        guard_name: "detect-pii"
        guardrails_ai_api_input_format: "llmOutput"
        api_base: http://guard.guardrails-ai:8000
    {{/if}}
    {{/with}}
