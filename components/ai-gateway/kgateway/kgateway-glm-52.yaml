# GLM-5.2 behind kgateway ai-gateway: /ai/glm-52/*
#
# kgateway does not talk to vLLM directly: every /ai/<model> route rewrites to
# /v1 on bifrost (the OpenAI-compatible hop that routes by the "model" field
# and emits the Langfuse trace), and bifrost's vllm provider key for
# glm-52-fp8 (components/ai-gateway/bifrost/bifrost.yaml) carries the pool URL.
# /ai/glm-52/chat/completions -> bifrost:8080/v1/chat/completions
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: glm-52-vllm
  namespace: kgateway-system
spec:
  type: Static
  static:
    hosts:
      - host: bifrost.bifrost.svc.cluster.local
        port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glm-52-route
  namespace: kgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ai/glm-52
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1
      backendRefs:
        - group: gateway.kgateway.dev
          kind: Backend
          name: glm-52-vllm
          weight: 1
      timeouts:
        request: 300s
        backendRequest: 300s
