# Qwen3.6-27B-FP8 (qwen36-27b-fp8, single L40S) behind kgateway ai-gateway: /ai/qwen36-27b/*
#
# Same shape as /ai/glm-52: kgateway does not talk to vLLM directly, every
# /ai/<model> route rewrites to /v1 on bifrost (OpenAI-compatible hop that
# routes by the "model" field and emits the Langfuse trace); bifrost's vllm
# provider key for qwen36-27b-fp8 (components/ai-gateway/bifrost/bifrost.yaml)
# carries the pool URL. Added so the traffic generator's load lane can push the
# same per-pool rate through kgateway as through LiteLLM (LOAD_GATEWAYS).
# /ai/qwen36-27b/chat/completions -> bifrost:8080/v1/chat/completions
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: qwen36-27b-vllm
  namespace: kgateway-system
spec:
  type: Static
  static:
    hosts:
      - host: bifrost.bifrost.svc.cluster.local
        port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen36-27b-route
  namespace: kgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ai/qwen36-27b
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1
      backendRefs:
        - group: gateway.kgateway.dev
          kind: Backend
          name: qwen36-27b-vllm
          weight: 1
      timeouts:
        request: 300s
        backendRequest: 300s
