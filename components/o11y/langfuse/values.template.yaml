global:
  security:
    # -- Allow insecure images to use our ECR images.
    allowInsecureImages: true

langfuse:
  # These three are cryptographic secrets, not config. They were hardcoded here,
  # which means every deployment of this public repo shared them. The salt is the
  # worst of the three: reusing it across deployments is the basis of the
  # LiteLLM/Langfuse proxy-admin privilege-escalation class of issue, because API
  # key hashes become portable between installs.
  # Supplied per deployment from the environment and validated by index.mjs.
  salt:
    value: {{{LANGFUSE_SALT}}}
  nextauth:
    secret:
      value: {{{LANGFUSE_NEXTAUTH_SECRET}}}
  encryptionKey:
    value: {{{LANGFUSE_ENCRYPTION_KEY}}}
  ingress:
    # Private by default — see the LiteLLM values template for the rationale.
    # Langfuse holds traces (prompts and completions), so it is not public
    # either. Without DOMAIN the Service stays ClusterIP; reach the UI with:
    #
    #   kubectl port-forward -n langfuse svc/langfuse-web 3000:3000
    #   # then http://localhost:3000
    enabled: {{#if DOMAIN}}true{{else}}false{{/if}}
    {{#if DOMAIN}}
    annotations:
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    hosts:
      - paths:
          - path: /
            pathType: Prefix
        host: langfuse.{{{DOMAIN}}}
    {{/if}}

  additionalEnv:
    - name: LANGFUSE_INIT_ORG_ID
      value: my-org
    - name: LANGFUSE_INIT_PROJECT_ID
      value: my-project
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      value: {{{LANGFUSE_PUBLIC_KEY}}}
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      value: {{{LANGFUSE_SECRET_KEY}}}
    - name: LANGFUSE_INIT_USER_EMAIL
      value: {{{LANGFUSE_USERNAME}}}
    - name: LANGFUSE_INIT_USER_PASSWORD
      value: {{{LANGFUSE_PASSWORD}}}
  resources:
    requests:
      cpu: 1 
      memory: 2Gi
    limits:
      memory: 2Gi

postgresql:
  image:
    registry: public.ecr.aws
    repository: agentic-ai-platforms-on-k8s/postgresql
    tag: 17.5.0-debian-12-r8
    pullPolicy: IfNotPresent
  # Backing datastore credential. Was the literal "password123", which every
  # deployment of this public repo shared -- the same shared-credential issue as
  # the admin UIs, just one layer down. Generated per deployment now.
  auth:
    username: admin
    password: {{{LANGFUSE_POSTGRES_PASSWORD}}}
  primary:
    resources: 
      requests:
        cpu: 125m
        memory: 256Mi
      limits:
        memory: 256Mi

clickhouse:
  image:
    registry: public.ecr.aws
    repository: agentic-ai-platforms-on-k8s/clickhouse
    tag: 25.2.1-debian-12-r0
    pullPolicy: IfNotPresent
  auth:
    password: {{{LANGFUSE_CLICKHOUSE_PASSWORD}}}
  replicaCount: 1
  resources:
    requests:
      cpu: 1    
      memory: 3Gi
      ephemeral-storage: 50Mi
    limits:
      memory: 3Gi
      ephemeral-storage: 2Gi
  zookeeper:
    image:
      registry: public.ecr.aws
      repository: agentic-ai-platforms-on-k8s/zookeeper
      tag: 3.9.3-debian-12-r8
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: 
      requests:
        cpu: 250m    
        memory: 384Mi
        ephemeral-storage: 50Mi
      limits:
        memory: 384Mi
        ephemeral-storage: 2Gi 

redis:
  image:
    registry: public.ecr.aws
    repository: agentic-ai-platforms-on-k8s/valkey
    tag: 8.0.2-debian-12-r2
    pullPolicy: IfNotPresent
  auth:
    password: {{{LANGFUSE_REDIS_PASSWORD}}}
  primary:
    resources: 
      requests:
        cpu: 125m
        memory: 256Mi
      limits:
        memory: 256Mi

s3:
  deploy: false

  bucket: "{{LANGFUSE_BUCKET_NAME}}"
  region: "{{AWS_REGION}}"
  endpoint: "" 
  forcePathStyle: false

  eventUpload:
    bucket: "{{LANGFUSE_BUCKET_NAME}}"
    prefix: "events/"
    region: "{{AWS_REGION}}"

  batchExport:
    enabled: true
    bucket: "{{LANGFUSE_BUCKET_NAME}}"
    prefix: "batch-exports/"
    region: "{{AWS_REGION}}"

  mediaUpload:
    enabled: true
    bucket: "{{LANGFUSE_BUCKET_NAME}}"
    prefix: "media/"
    region: "{{AWS_REGION}}"
