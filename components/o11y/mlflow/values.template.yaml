global:
  security:
    # -- Allow insecure images to use our ECR images.
    allowInsecureImages: true

ingress:
  # Private by default: no Ingress unless DOMAIN is set, so MLflow stays
  # ClusterIP. Reach it with a port-forward:
  #   kubectl port-forward -n mlflow svc/mlflow 5000:80
  enabled: {{#if DOMAIN}}true{{else}}false{{/if}}
  className: {{#if DOMAIN}}shared-{{/if}}internet-facing-alb
  annotations:
      alb.ingress.kubernetes.io/target-type: ip
      {{#if DOMAIN}}
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      {{/if}}
  hosts:
    - paths:
        - path: /
          pathType: Prefix
      host: {{#if DOMAIN}}mlflow.{{{DOMAIN}}}{{else}}"*.{{{AWS_REGION}}}.elb.amazonaws.com"{{/if}}

extraEnvVars:
  MLFLOW_SERVER_ALLOWED_HOSTS: "localhost:*,10.*,mlflow.mlflow,{{#if DOMAIN}}mlflow.{{{DOMAIN}}}{{else}}*.{{{AWS_REGION}}}.elb.amazonaws.com{{/if}}"
  # MLFLOW_LOGGING_LEVEL: "DEBUG"

auth:
  enabled: true
  adminUsername: {{{MLFLOW_USERNAME}}}
  adminPassword: {{{MLFLOW_PASSWORD}}}

postgresql:
  enabled: true
  image:
    registry: public.ecr.aws
    repository: agentic-ai-platforms-on-k8s/postgresql
    tag: 17.5.0-debian-12-r8
    pullPolicy: IfNotPresent
  # Backing datastore credential, generated per deployment. Was the literal
  # "password123", shared by every deployment of this public repo.
  auth:
    username: admin
    password: {{{MLFLOW_POSTGRES_PASSWORD}}}
  primary:
    resources: 
      requests:
        cpu: 125m
        memory: 256Mi
      limits:
        memory: 256Mi

artifactRoot:
  s3:
    enabled: true
    bucket: {{{MLFLOW_BUCKET_NAME}}}
