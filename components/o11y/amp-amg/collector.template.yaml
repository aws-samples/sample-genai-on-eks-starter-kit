# ADOT Collector, deployed as an OpenTelemetryCollector custom resource that is
# reconciled by the ADOT Operator (installed via the EKS `adot` managed add-on).
# This replaces the previous community opentelemetry-collector Helm chart +
# `aws-otel-collector:latest` image override: the Operator and its collector
# image are now version-managed by the EKS add-on, so there is no floating tag.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adot-collector
  namespace: {{NAMESPACE}}
  # EKS Pod Identity associates this ServiceAccount with the adot-collector IAM
  # role (aps:RemoteWrite) via the aws_eks_pod_identity_association in main.tf —
  # no IAM role annotation is required.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adot-collector
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adot-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adot-collector
subjects:
  - kind: ServiceAccount
    name: adot-collector
    namespace: {{NAMESPACE}}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: adot-collector
  namespace: {{NAMESPACE}}
spec:
  mode: deployment
  serviceAccount: adot-collector
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  config:
    receivers:
      prometheus:
        config:
          global:
            scrape_interval: 30s
            evaluation_interval: 30s
          scrape_configs:
            # vLLM metrics
            - job_name: "vllm"
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: ["vllm"]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_phase]
                  action: keep
                  regex: Running
                - source_labels: [__meta_kubernetes_pod_ip]
                  action: replace
                  regex: (.+)
                  replacement: "$$1:8000"
                  target_label: __address__
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
            # Kubernetes node metrics
            - job_name: "kubernetes-nodes"
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(.+)

    exporters:
      prometheusremotewrite:
        endpoint: "{{AMP_REMOTE_WRITE_ENDPOINT}}"
        auth:
          authenticator: sigv4auth
        resource_to_telemetry_conversion:
          enabled: true

    extensions:
      health_check: {}
      sigv4auth:
        region: "{{AWS_REGION}}"
        service: "aps"

    service:
      extensions: [health_check, sigv4auth]
      pipelines:
        metrics:
          receivers: [prometheus]
          exporters: [prometheusremotewrite]
