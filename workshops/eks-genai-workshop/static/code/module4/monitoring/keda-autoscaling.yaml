# KEDA event-driven autoscaling for the GenAI platform — Module 4.
#
# vLLM scales on the LEADING indicator vllm:num_requests_waiting (queue depth)
# queried from Amazon Managed Service for Prometheus via the keda-operator Pod Identity
# (role genai-ws-keda-reader, AmazonPrometheusQueryAccess). LiteLLM scales on CPU
# (stateless gateway, no Prometheus endpoint) with a standard HPA.
#
# Apply with the AMP endpoint + region substituted:
#   sed -e "s#__AMP_ENDPOINT__#$AMP_ENDPOINT#" -e "s#__REGION__#$AWS_REGION#" \
#     keda-autoscaling.yaml | kubectl apply -f -
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: amp-auth
  namespace: vllm
spec:
  podIdentity:
    provider: aws
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-scaledobject
  namespace: vllm
spec:
  scaleTargetRef:
    name: qwen3-8b-neuron
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        # NOTE: must NOT have a trailing slash. The AMP workspace endpoint ends
        # with "/", and KEDA appends "/api/v1/query" — a trailing slash produces
        # "//api/v1/query" which AMP rejects with 403. __AMP_ENDPOINT__ is
        # substituted with the slash already stripped.
        serverAddress: "__AMP_ENDPOINT__"
        query: avg(vllm:num_requests_waiting{namespace="vllm"})
        threshold: "3"
        awsRegion: "__REGION__"
        identityOwner: operator
      authenticationRef:
        name: amp-auth
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: litellm-hpa
  namespace: litellm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: litellm
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
