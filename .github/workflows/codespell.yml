name: Spell Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install codespell
        run: pip install codespell==2.4.3

      - name: Run codespell
        run: codespell
