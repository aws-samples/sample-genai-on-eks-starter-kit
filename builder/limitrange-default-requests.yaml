# Safety net: any container deployed without CPU/memory requests gets these
# defaults so the scheduler and Karpenter account for it. No default *limit*
# is set on purpose (limits stay the component's decision). Existing pods are
# only affected when they are recreated.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 128Mi
